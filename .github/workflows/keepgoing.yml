name: Looptender formula

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  install:
    name: macOS package (${{ matrix.scenario }})
    runs-on: macos-15
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        scenario: [fresh, alias, upgrade, legacy-upgrade]
    env:
      HOMEBREW_NO_AUTO_UPDATE: "1"
      HOMEBREW_NO_ANALYTICS: "1"
      HOMEBREW_NO_INSTALL_CLEANUP: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Validate package and receipt transition
        env:
          SCENARIO: ${{ matrix.scenario }}
        run: bash scripts/check-package.sh "$SCENARIO"
